[project]
name = "qwen-neuron-lab"
version = "0.1.0"
description = "Causal tests of sparse neuron interventions on unwanted Qwen proxy requests"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["modal==1.6.2", "numpy==2.5.4", "huggingface-hub==2.3.0"]

[project.optional-dependencies]
research = ["torch==2.14.1", "transformers==5.21.0", "accelerate==1.15.0"]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
