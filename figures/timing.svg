<text x="32" y="68" font-size="13.5" fill="#6b7280" font-weight="400" text-anchor="start" >Proxy calls out of 128 runs, with the first 12 neurons switched off during one stage of the response at a time</text>
<text x="316" y="129" font-size="14" fill="#111827" font-weight="400" text-anchor="end" >Unmodified model</text>
<rect x="330" y="112" width="168.0" height="24" rx="4" fill="#dc2626"/>
<text x="508.0" y="129" font-size="14" fill="#dc2626" font-weight="700" text-anchor="start" >14 of 128</text>
<text x="316" y="181" font-size="14" fill="#111827" font-weight="400" text-anchor="end" >Off while reading the prompt and the 403</text>
<rect x="330" y="164" width="228.0" height="24" rx="4" fill="#dc2626"/>
<text x="568.0" y="181" font-size="14" fill="#dc2626" font-weight="700" text-anchor="start" >19 of 128</text>
<text x="316" y="233" font-size="14" fill="#111827" font-weight="400" text-anchor="end" >Off during the reasoning</text>
<rect x="330" y="216" width="204.0" height="24" rx="4" fill="#dc2626"/>
<text x="544.0" y="233" font-size="14" fill="#dc2626" font-weight="700" text-anchor="start" >17 of 128</text>
<text x="316" y="285" font-size="14" fill="#111827" font-weight="600" text-anchor="end" >Off once the tool call starts</text>
<rect x="330" y="268" width="2" height="24" rx="4" fill="#059669"/>
<text x="340.0" y="285" font-size="14" fill="#059669" font-weight="700" text-anchor="start" >0 of 128</text>
<line x1="330" y1="102" x2="330" y2="320" stroke="#e5e7eb"/>
<rect x="650" y="100" width="400" height="250" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="668" y="130" font-size="15" fill="#111827" font-weight="700" text-anchor="start" >Where those neurons' effect lands</text>
<text x="668" y="150" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" >Share of their total effect on the odds of the Alibaba address,</text>
<text x="668" y="166" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" >from replays of 13 failing transcripts</text>
<rect x="668.0" y="186" width="3.6" height="30" fill="#9ca3af"/>
<rect x="671.6" y="186" width="7.3" height="30" fill="#9ca3af"/>
<rect x="678.9" y="186" width="269.4" height="30" fill="#059669"/>
<rect x="948.3" y="186" width="83.7" height="30" fill="#a7f3d0"/>
<rect x="668" y="186" width="364" height="30" fill="none" stroke="#e5e7eb"/>
<rect x="668" y="231" width="12" height="12" fill="#9ca3af" stroke="#e5e7eb"/>
<text x="688" y="242" font-size="13" fill="#111827" font-weight="400" text-anchor="start" >Prompt and 403: 1%</text>
<rect x="668" y="255" width="12" height="12" fill="#9ca3af" stroke="#e5e7eb"/>
<text x="688" y="266" font-size="13" fill="#111827" font-weight="400" text-anchor="start" >Reasoning: 2%</text>
<rect x="668" y="279" width="12" height="12" fill="#059669" stroke="#e5e7eb"/>
<text x="688" y="290" font-size="13" fill="#111827" font-weight="700" text-anchor="start" >First token after https://: 74%</text>
<rect x="668" y="303" width="12" height="12" fill="#a7f3d0" stroke="#e5e7eb"/>
<text x="688" y="314" font-size="13" fill="#111827" font-weight="400" text-anchor="start" >Rest of the tool call: 23%</text>
<text x="32" y="408" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" >Qwen3.8-27B, SEC filing task with a 403 returned to the first fetch. Same 128 seeds in every row.</text>

</svg>
